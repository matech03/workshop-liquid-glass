<!doctype html>
<meta charset="utf-8">
<!-- Ảnh nền bìa cho pptx (tools/build-pptx.mjs chụp file này): nền nhiều màu + một khối Liquid Glass tròn. -->
<style>
html,body{margin:0;width:700px;height:1080px;overflow:hidden}
.field{position:absolute;inset:0;background:#C9D3F2;overflow:hidden;isolation:isolate}
.field::before{content:"";position:absolute;inset:-22%;z-index:-2;background:
  radial-gradient(30% 34% at 24% 30%,#FF7A9A,transparent 72%),
  radial-gradient(28% 32% at 78% 24%,#FFC56E,transparent 72%),
  radial-gradient(34% 38% at 68% 78%,#6FB6FF,transparent 72%),
  radial-gradient(26% 30% at 26% 80%,#7DEBC6,transparent 72%),
  radial-gradient(24% 28% at 50% 52%,#B999FF,transparent 72%)}
.field::after{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.45) 1.4px,transparent 1.9px);background-size:28px 28px}
.disc{position:absolute;left:160px;top:350px;width:380px;height:380px;border-radius:50%;
  background:linear-gradient(155deg,rgba(255,255,255,.34),rgba(255,255,255,.1) 38%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.16));
  -webkit-backdrop-filter:blur(16px) saturate(175%) brightness(1.06);backdrop-filter:blur(16px) saturate(175%) brightness(1.06);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.18),inset 0 -18px 40px rgba(10,14,24,.12),0 24px 50px -24px rgba(18,21,40,.5)}
.disc::before{content:"";position:absolute;left:15%;top:9%;width:46%;height:30%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(-24deg)}
</style>
<div class="field"><div class="disc"></div></div>
